label><label class="full">Notas<textarea name="notes"></textarea></label></div><div class="actions"><button class="btn btn-primary" type="submit">Guardar</button><button class="btn btn-soft" type="button" data-close-modal>Cancelar</button></div></form></div></div><footer class="footer"><div class="footer-row"><span>BBDD interna IndexedDB. Personas es el único listado de fichas y turnos. Exporta backup JSON periódicamente.</span><button type="button" class="btn btn-soft btn-small footer-settings" data-settings-gate>Ajustes</button></div></footer></body></html>
